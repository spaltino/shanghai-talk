<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>상하이 소통카드 · 上海沟通卡</title>
<meta name="description" content="상하이 현장에서 1초 만에 보여주는 중국어 소통카드. 장소 → 상황 → 순서별 대화카드, 화면 가득 확대 모드. 인터넷 없이도 열립니다." />
<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="상하이톡" />
<meta property="og:title" content="상하이 소통카드" />
<meta property="og:description" content="병원·약국·택시·공항·식당에서 바로 보여주는 중국어 카드 200장" />
<meta property="og:type" content="website" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23ff8a3d' font-family='sans-serif'%3E%E8%AF%B4%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0b1220; --panel:#111c2e; --card:#152135; --card2:#1b2942;
    --line:#26364f; --ink:#eef4fb; --muted:#96a7be; --dim:#6d7f98;
    --accent:#ff8a3d; --accent2:#2fd3a4; --blue:#48b8f5;
    --radius:16px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
            "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(1100px 520px at 80% -12%, rgba(255,138,61,.12), transparent 60%),
      radial-gradient(900px 460px at 6% 0%, rgba(47,211,164,.08), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  a{color:inherit}
  button{font-family:inherit; color:inherit; background:none; border:0; cursor:pointer}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:rgba(11,18,32,.92); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .nav-btn{
    flex:0 0 auto; min-width:44px; height:44px; padding:0 12px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    border-radius:12px; background:var(--card); border:1px solid var(--line);
    font-size:15px; font-weight:600; color:var(--ink);
  }
  .nav-btn:active{background:var(--card2)}
  .nav-btn[hidden]{display:none}
  .htitle{flex:1 1 auto; min-width:0}
  .htitle b{display:block; font-size:16px; font-weight:800; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .htitle span{display:block; font-size:11.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .brand{display:flex; align-items:center; gap:9px; flex:1 1 auto; min-width:0}
  .brand .logo{
    width:38px; height:38px; border-radius:11px; flex:0 0 auto;
    background:linear-gradient(145deg,#ff8a3d,#ff5f6d);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:#0b1220;
  }

  main{max-width:760px; margin:0 auto; padding:14px 14px 40px}
  .view[hidden]{display:none}

  /* ---------- step 1 ---------- */
  .lede{
    margin:2px 0 14px; padding:14px 16px; border-radius:var(--radius);
    background:linear-gradient(140deg, rgba(255,138,61,.10), rgba(47,211,164,.06));
    border:1px solid var(--line);
  }
  .lede .t{font-size:13px; color:var(--muted)}
  .lede .t b{color:var(--ink); font-weight:700}
  .lede .steps{display:flex; align-items:center; gap:6px; margin-top:9px; font-size:11.5px; color:var(--dim); flex-wrap:wrap}
  .lede .steps i{
    font-style:normal; padding:3px 9px; border-radius:999px;
    background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--muted);
  }
  .lede .steps i.on{background:rgba(255,138,61,.16); border-color:rgba(255,138,61,.45); color:#ffb787}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .place{
    position:relative; text-align:left; padding:16px 14px 14px;
    border-radius:18px; background:linear-gradient(160deg,var(--card),#121d2e);
    border:1px solid var(--line);
    display:flex; flex-direction:column; gap:6px; min-height:118px;
    transition:transform .08s ease, border-color .15s ease;
  }
  .place:active{transform:scale(.98); border-color:rgba(255,138,61,.55)}
  .place .em{font-size:28px; line-height:1.1}
  .place .nm{font-size:17px; font-weight:800; letter-spacing:-.2px}
  .place .note{font-size:11.5px; color:var(--dim); line-height:1.35}
  .place .cnt{
    margin-top:auto; font-size:11px; color:var(--accent);
    background:rgba(255,138,61,.12); border:1px solid rgba(255,138,61,.3);
    padding:2px 8px; border-radius:999px; align-self:flex-start;
  }
  .place.urgent{background:linear-gradient(160deg,#2a1620,#1a1220); border-color:#4a2334}
  .place.urgent .cnt{color:#ff8f9c; background:rgba(255,95,110,.12); border-color:rgba(255,95,110,.3)}

  /* ---------- step 2 ---------- */
  .scenes{display:flex; flex-direction:column; gap:10px}
  .scene{
    display:flex; align-items:center; gap:13px; width:100%; text-align:left;
    padding:15px 14px; border-radius:16px;
    background:var(--card); border:1px solid var(--line);
  }
  .scene:active{background:var(--card2)}
  .scene .no{
    flex:0 0 auto; width:34px; height:34px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,138,61,.14); border:1px solid rgba(255,138,61,.32);
    color:#ffb787; font-weight:800; font-size:15px;
  }
  .scene .tx{flex:1 1 auto; min-width:0}
  .scene .tx b{display:block; font-size:16px; font-weight:700}
  .scene .tx span{display:block; font-size:11.5px; color:var(--dim); margin-top:2px}
  .scene .arw{flex:0 0 auto; color:var(--dim); font-size:18px}

  /* ---------- step 3 ---------- */
  .cards{display:flex; flex-direction:column; gap:10px}
  .card{
    width:100%; text-align:left; padding:14px 15px 13px; border-radius:16px;
    background:var(--card); border:1px solid var(--line);
    display:block; position:relative;
  }
  .card:active{background:var(--card2)}
  .card .top{display:flex; align-items:center; gap:8px; margin-bottom:7px; padding-right:54px}
  .card .idx{
    font-size:11px; font-weight:800; color:#9fb2cb; min-width:20px;
    width:22px; height:22px; border-radius:7px; background:rgba(255,255,255,.06);
    display:flex; align-items:center; justify-content:center;
  }
  .card .qline{
    font-size:11.5px; color:#ffb787; background:rgba(255,138,61,.10);
    border:1px solid rgba(255,138,61,.24); border-radius:999px;
    padding:2px 9px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card .zh{font-size:22px; font-weight:700; line-height:1.42; letter-spacing:-.2px; color:#fff; word-break:keep-all; overflow-wrap:anywhere}
  .card .py{font-size:12px; color:var(--blue); margin-top:5px; opacity:.9; overflow-wrap:anywhere}
  .card .ko{font-size:13px; color:var(--muted); margin-top:5px}
  .card .zoom{
    position:absolute; top:12px; right:12px;
    font-size:10.5px; color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:2px 6px;
  }
  .card .top + .zh{margin-top:2px}
  .nw{white-space:nowrap}
  .hint{font-size:11.5px; color:var(--dim); text-align:center; margin:16px 0 0; line-height:1.6}

  /* ---------- fullscreen ---------- */
  .fs{
    position:fixed; inset:0; z-index:100; background:#fff; color:#000;
    display:flex; flex-direction:column;
    padding:calc(12px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
    touch-action:pan-y;
  }
  .fs[hidden]{display:none}
  .fs .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex:0 0 auto; width:100%; max-width:860px; margin:0 auto}
  .fs .count{font-size:13px; font-weight:700; color:#111; background:#f1f2f4; border-radius:999px; padding:5px 11px}
  .fs .close{
    width:44px; height:44px; border-radius:50%; background:#f1f2f4; color:#111;
    font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .fs .body{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:10px 0 4px; min-height:0; width:100%; max-width:860px; margin:0 auto}
  .fs .q{font-size:15px; color:#666; margin-bottom:14px; line-height:1.45; max-width:100%}
  .fs .q b{color:#111; font-weight:700}
  .fs .zh{font-weight:800; line-height:1.42; letter-spacing:-.3px; color:#000; word-break:normal; line-break:strict; overflow-wrap:break-word}
  .fs .py{font-size:15px; color:#5b6b80; margin-top:16px; font-weight:600; overflow-wrap:anywhere}
  .fs .ko{font-size:14.5px; color:#666; margin-top:18px; padding-top:14px; border-top:1px solid #e3e5e9; line-height:1.5}
  .fs .ctrl{flex:0 0 auto; display:flex; gap:10px; align-items:stretch; width:100%; max-width:700px; margin:0 auto}
  .fs .ctrl button{
    flex:1 1 0; height:62px; border-radius:16px; background:#f1f2f4; color:#111;
    font-size:17px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px;
    border:1px solid #e3e5e9;
  }
  .fs .ctrl button:active{background:#e6e8ec}
  .fs .ctrl button:disabled{opacity:.35}
  .fs .dots{display:flex; gap:4px; justify-content:center; padding:9px 0 1px; flex-wrap:wrap; flex:0 0 auto}
  .fs .dots i{width:5px; height:5px; border-radius:50%; background:#d6d9de}
  .fs .dots i.on{background:#111; width:14px; border-radius:3px}

  @media (min-width:620px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .card .zh{font-size:24px}
  }
</style>
</head>
<body>

<header>
  <button class="nav-btn" id="btnBack" hidden aria-label="뒤로">‹</button>
  <div class="brand">
    <div class="logo">说</div>
    <div class="htitle">
      <b id="hTitle">상하이 소통카드</b>
      <span id="hSub">장소 → 상황 → 카드 · 2026.11.26 상하이</span>
    </div>
  </div>
  <button class="nav-btn" id="btnHome" hidden aria-label="처음으로">⌂</button>
</header>

<main>
  <!-- STEP 1 -->
  <section class="view" id="view1">
    <div class="lede">
      <div class="t"><b>어디서 쓰실 건가요?</b> 장소를 고르면 그 자리에서 바로 쓰는 순서대로 나옵니다.</div>
      <div class="steps"><i class="on">1 장소</i><i>2 상황</i><i>3 카드</i></div>
    </div>
    <div class="grid" id="placeGrid"></div>
    <p class="hint">카드를 누르면 화면 가득 크게 뜹니다.<br>상대방에게 폰을 내밀고 보여주세요. · 인터넷 없이도 열립니다</p>
  </section>

  <!-- STEP 2 -->
  <section class="view" id="view2" hidden>
    <div class="lede">
      <div class="t"><b id="ledePlace">병원</b> 안에서 겪는 상황을 순서대로 골랐습니다.</div>
      <div class="steps"><i>1 장소</i><i class="on">2 상황</i><i>3 카드</i></div>
    </div>
    <div class="scenes" id="sceneList"></div>
  </section>

  <!-- STEP 3 -->
  <section class="view" id="view3" hidden>
    <div class="lede">
      <div class="t"><b id="ledeScene">① 접수</b> · 실제로 부딪히는 순서대로입니다.</div>
      <div class="steps"><i>1 장소</i><i>2 상황</i><i class="on">3 카드</i></div>
    </div>
    <div class="cards" id="cardList"></div>
    <p class="hint">카드를 누르면 확대 · 좌우로 넘겨 이어서 보여줄 수 있습니다.</p>
  </section>
</main>

<!-- FULLSCREEN -->
<div class="fs" id="fs" hidden>
  <div class="bar">
    <div class="count" id="fsCount">1 / 1</div>
    <button class="close" id="fsClose" aria-label="닫기">✕</button>
  </div>
  <div class="body" id="fsBody">
    <div class="q" id="fsQ" hidden></div>
    <div class="zh" id="fsZh"></div>
    <div class="py" id="fsPy"></div>
    <div class="ko" id="fsKo"></div>
  </div>
  <div class="ctrl">
    <button id="fsPrev">‹ 이전</button>
    <button id="fsNext">다음 ›</button>
  </div>
  <div class="dots" id="fsDots"></div>
</div>

<script>
/* ============ DATA ============ */
/* card: [중국어, 병음, 한국어, (상대방 예상 질문)] */
const C = (zh, py, ko, q) => ({zh, py, ko, q});

const PLACES = [
{

      C('请问在哪里报到？','qǐngwèn zài nǎlǐ bàodào','접수(도착 보고)는 어디서 해요?'),
      C('地址是北园路33号，健康管理中心一楼。','dìzhǐ shì Běiyuán lù sānshísān hào, jiànkāng guǎnlǐ zhōngxīn yī lóu','주소는 북원로 33호, 건강관리센터 1층입니다. (기사·직원에게 보여주기)'),
      C('我是韩国人，听不懂中文。','wǒ shì hánguórén, tīngbudǒng zhōngwén','한국인이라 중국어를 못 알아듣습니다.'),

      C('HONG TEAK LIM。','HONG TEAK LIM','홍택림입니다.','您叫什么名字？'),
      C('好的，这是我的护照。','hǎo de, zhè shì wǒ de hùzhào','네, 여기 여권입니다.','请出示护照。'),
      C('是的，我从韩国来。','shì de, wǒ cóng hánguó lái','네, 한국에서 왔습니다.','您是韩国人吗？'),

    { name:'진료 · 마운자로 처방', sub:'5mg 1펜 · 종이 처방전 요청', cards:[

      C('可以帮我拍张照片吗？','kěyǐ bāng wǒ pāi zhāng zhàopiàn ma','사진 좀 찍어 주실 수 있나요?'),

/* 숫자·시간은 줄바꿈으로 쪼개지 않게 */
const fmt = s => s.replace(/([0-9][0-9.]*(?:[点時时][0-9]+分?)?(?:毫克|毫升|公斤|厘米|公里|小时|分钟|个月|月|周|次|天|号|楼|层|元|支|个|位|种|瓶|盒|张|份|家|度)?)/g, m => '<span class="nw">' + m + '</span>');

/* ============ STATE ============ */
let place = null, scene = null, cardIdx = 0;
const $ = id => document.getElementById(id);
const view1 = $('view1'), view2 = $('view2'), view3 = $('view3');
const btnBack = $('btnBack'), btnHome = $('btnHome'), hTitle = $('hTitle'), hSub = $('hSub');
const fs = $('fs'), fsQ = $('fsQ'), fsZh = $('fsZh'), fsPy = $('fsPy'), fsKo = $('fsKo'), fsCount = $('fsCount'), fsDots = $('fsDots');

/* ============ STEP 1 ============ */
function renderPlaces(){
  $('placeGrid').innerHTML = PLACES.map(p => {
    const n = p.scenes.reduce((a,s)=>a+s.cards.length,0);
    return `<button class="place ${p.urgent?'urgent':''}" data-place="${p.id}">
      <div class="em">${p.em}</div>
      <div class="nm">${p.name}</div>
      <div class="note">${p.note}</div>
      <div class="cnt">${p.scenes.length}상황 · ${n}장</div>
    </button>`;
  }).join('');
}

/* ============ STEP 2 ============ */
function renderScenes(){
  $('ledePlace').textContent = place.em + ' ' + place.name;
  $('sceneList').innerHTML = place.scenes.map((s,i)=>`
    <button class="scene" data-scene="${i}">
      <div class="no">${i+1}</div>
      <div class="tx"><b>${s.name}</b><span>${s.sub} · ${s.cards.length}장</span></div>
      <div class="arw">›</div>
    </button>`).join('');
}

/* ============ STEP 3 ============ */
function renderCards(){
  $('ledeScene').textContent = scene.name;
  $('cardList').innerHTML = scene.cards.map((c,i)=>`
    <button class="card" data-card="${i}">
      <div class="top">
        <div class="idx">${i+1}</div>
        ${c.q ? `<div class="qline">← ${c.q}</div>` : ''}
        <div class="zoom">크게</div>
      </div>
      <div class="zh">${fmt(c.zh)}</div>
      <div class="py">${c.py}</div>
      <div class="ko">${c.ko}</div>
    </button>`).join('');
  window.scrollTo({top:0});
}

/* ============ VIEWS ============ */
function show(n){
  [view1,view2,view3].forEach((v,i)=>v.hidden = (i+1!==n));
  btnBack.hidden = n===1;
  btnHome.hidden = n===1;
  if(n===1){ hTitle.textContent='상하이 소통카드'; hSub.textContent='장소 → 상황 → 카드 · 2026.11.26 상하이'; window.scrollTo({top:0}); }
  if(n===2){ hTitle.textContent = place.em+' '+place.name; hSub.textContent = '상황을 고르세요'; }
  if(n===3){ hTitle.textContent = scene.name; hSub.textContent = place.name + ' · ' + scene.cards.length + '장'; }
  history.replaceState({n}, '');
}
btnBack.onclick = () => { if(view3.hidden===false) show(2); else show(1); };
btnHome.onclick = () => { closeFs(); show(1); };

document.addEventListener('click', e=>{
  const p = e.target.closest('[data-place]');
  if(p){ place = PLACES.find(x=>x.id===p.dataset.place); renderScenes(); show(2); return; }
  const s = e.target.closest('[data-scene]');
  if(s){ scene = place.scenes[+s.dataset.scene]; renderCards(); show(3); return; }
  const c = e.target.closest('[data-card]');
  if(c){ openFs(+c.dataset.card); }
});

/* ============ FULLSCREEN ============ */
function fitSize(len){
  const w = Math.min(window.innerWidth, 620);
  let s;
  if(len <= 8) s = w * 0.145;
  else if(len <= 13) s = w * 0.105;
  else if(len <= 20) s = w * 0.082;
  else if(len <= 30) s = w * 0.066;
  else s = w * 0.058;
  return Math.max(24, Math.min(s, 72));
}
function drawFs(){
  const c = scene.cards[cardIdx];
  if(c.q){ fsQ.hidden = false; fsQ.innerHTML = '<b>' + fmt(c.q) + '</b>'; }
  else fsQ.hidden = true;
  fsZh.innerHTML = fmt(c.zh);
  fsZh.style.fontSize = fitSize(c.zh.length) + 'px';
  fsPy.textContent = c.py;
  fsKo.textContent = c.ko;
  fsCount.textContent = (cardIdx+1) + ' / ' + scene.cards.length;
  $('fsPrev').disabled = cardIdx === 0;
  $('fsNext').disabled = cardIdx === scene.cards.length-1;
  fsDots.innerHTML = scene.cards.map((_,i)=>`<i class="${i===cardIdx?'on':''}"></i>`).join('');
}
function openFs(i){ cardIdx = i; drawFs(); fs.hidden = false; document.body.style.overflow='hidden'; }
function closeFs(){ fs.hidden = true; document.body.style.overflow=''; }
function go(d){ const n = cardIdx + d; if(n<0 || n>=scene.cards.length) return; cardIdx = n; drawFs(); }
$('fsClose').onclick = closeFs;
$('fsPrev').onclick = ()=>go(-1);
$('fsNext').onclick = ()=>go(1);

document.addEventListener('keydown', e=>{
  if(fs.hidden) return;
  if(e.key==='Escape') closeFs();
  if(e.key==='ArrowRight' || e.key===' ') { e.preventDefault(); go(1); }
  if(e.key==='ArrowLeft') { e.preventDefault(); go(-1); }
});

/* swipe */
let sx=0, sy=0, moved=false;
fs.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; moved=false; }, {passive:true});
fs.addEventListener('touchmove', e=>{ if(Math.abs(e.touches[0].clientX-sx)>12) moved=true; }, {passive:true});
fs.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.4){ go(dx < 0 ? 1 : -1); }
});

/* init */
renderPlaces();
show(1);

/* offline */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
