<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dev-width · 상하이톡 폭 검증</title>
<style>
  body{background:#0b1220;color:#dce7f5;font:13px/1.6 -apple-system,system-ui,sans-serif;margin:0;padding:16px}
  pre{background:#111c2e;border:1px solid #24344d;border-radius:10px;padding:12px;white-space:pre-wrap;font-size:12px}
  .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .frame{border:1px solid #2b3d58;border-radius:8px;overflow:hidden;background:#0b1220}
  iframe{border:0;display:block}
</style>
</head>
<body>
<h1 style="font-size:15px">폭 검증 (320 / 375 / 390)</h1>
<div class="row">
  <div class="frame"><div id="lbl390" style="font-size:11px;padding:3px 6px;color:#9fb2cb">390px 프리뷰</div><iframe id="vf" src="./index.html?preview=390" width="390" height="820"></iframe></div>
  <pre id="out">측정 중…</pre>
</div>
<script>
const WIDTHS = [320, 375, 390];
const out = document.getElementById('out');
const lines = [];

function measure(width){
  return new Promise(resolve=>{
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;left:-9999px;top:0;border:0;width:'+width+'px;height:900px';
    f.src = './index.html?w=' + width + '&t=' + Date.now();
    f.onload = ()=>{
      try{
        const d = f.contentDocument, w = f.contentWindow;
        setTimeout(()=>{
          const rt = d.getElementById('routeToggle'); if (rt && f.contentDocument.getElementById('routeBody').hidden) rt.click();
          setTimeout(()=>{
            const mt = d.getElementById('mgToggle'); if (mt && d.getElementById('mgBody').hidden) mt.click();
            setTimeout(()=>{
              const de = d.documentElement;
              const cw = de.clientWidth;
              const offenders = [...d.querySelectorAll('body *')].filter(el=>{
                const r = el.getBoundingClientRect();
                if (!r.width) return false;
                if (el.closest('.fs') || el.classList.contains('fs')) return false;
                return r.right > cw + 1;
              }).slice(0,10).map(el=>{
                const r = el.getBoundingClientRect();
                return el.tagName.toLowerCase()+'.'+String(el.className||'').split(' ').filter(Boolean).slice(0,2).join('.')
                  +' right='+Math.round(r.right)+' w='+Math.round(r.width);
              });
              const imgs = [...d.querySelectorAll('img')];
              const broken = imgs.filter(i=>!i.complete || i.naturalWidth===0).length;
              lines.push('['+width+'px] clientW='+cw+' docScrollW='+de.scrollWidth
                +' overflow='+(de.scrollWidth-cw)
                +' imgs='+imgs.length+' broken='+broken
                +' cards='+d.querySelectorAll('.cards .card, .card').length);
              lines.push('   offenders: '+(offenders.length? offenders.join(' | ') : 'none'));
              resolve();
            }, 600);
          }, 200);
        }, 400);
      }catch(e){ lines.push('['+width+'] error '+e); resolve(); }
    };
    document.body.appendChild(f);
  });
}
(async ()=>{
  for (const w of WIDTHS) await measure(w);
  out.textContent = lines.join('\n');
})();
</script>
</body>
</html>
