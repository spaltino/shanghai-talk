<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>dev 390 검증</title>
<style>
 body{margin:0;background:#05080f;color:#9fb2cb;font:12px/1.4 -apple-system,sans-serif;display:flex;gap:16px;padding:12px}
 figure{margin:0}
 figcaption{color:#7ff0cd;margin-bottom:6px}
 iframe{width:390px;height:844px;border:1px solid #2b3d58;border-radius:10px;background:#0b1220}
</style></head><body>
<figure><figcaption>A · 390×844 홈(동선 접힘)</figcaption><iframe id="a" src="./index.html"></iframe></figure>
<figure><figcaption>B · 390×844 동선 펼침 → Plan B</figcaption><iframe id="b" src="./index.html"></iframe></figure>
<figure><figcaption>C · 390×844 택시 &gt; 타기·목적지</figcaption><iframe id="c" src="./index.html"></iframe></figure>

<script>
function ready(id){return new Promise(r=>{const i=document.getElementById(id);
  const go=()=>{try{ if(i.contentDocument && i.contentDocument.readyState==='complete' && i.contentDocument.querySelector('.place')) r(i); else setTimeout(go,120);}catch(e){setTimeout(go,200)}};
  i.addEventListener('load',()=>setTimeout(go,120)); setTimeout(go,500);});}
function prep(id){const i=document.getElementById(id), d=i.contentDocument;
  const st=d.createElement('style'); st.textContent='html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important} html{scrollbar-width:none}'; d.head.appendChild(st);
  return d;}

window.__measure = () => {
  const out = {};
  const scan = (d) => {
    const de = d.documentElement;
    const vw = de.clientWidth;
    const scrollable = n => { let p = n.parentElement;
      while (p && p !== d.body){ const cs = d.defaultView.getComputedStyle(p); if (/(auto|scroll)/.test(cs.overflowX)) return true; p = p.parentElement; } return false; };
    const bad = [];
    for (const el of d.querySelectorAll('body *')){
      const r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) continue;
      if (r.right > vw + 0.6 && !scrollable(el)) bad.push(el.tagName + '.' + String(el.className||'').slice(0,28) + ' right=' + Math.round(r.right) + ' ' + (el.textContent||'').trim().slice(0,24));
    }
    return {vw, scrollW: de.scrollWidth, overflow: de.scrollWidth - vw, badCount: bad.length, bad: bad.slice(0,10)};
  };
  ['a','b','c'].forEach(k=>{
    const d = document.getElementById(k).contentDocument;
    out[k] = scan(d);
    out[k].clipped = [...d.querySelectorAll('.card .zh,.card .py,.card .ko,.stp-l li,.sp-h b,.stp-tx b,figcaption,.sp-m,.mg-l li,.mg-h h4,.mg-walk li,.mg-walk h4')]
      .filter(e=>e.offsetParent!==null && e.scrollWidth > e.clientWidth + 1).map(e=>e.textContent.trim().slice(0,50));
  });
  // Plan B block detail in B
  const db = document.getElementById('b').contentDocument;
  const h4 = [...db.querySelectorAll('h4')].find(h=>h.textContent.includes('Plan B'));
  if (h4){
    const box = h4.parentElement, r = box.getBoundingClientRect();
    const img = box.querySelector('img');
    const ir = img ? img.getBoundingClientRect() : null;
    out.planB = {
      boxRight: Math.round(r.right), boxW: Math.round(r.width), boxScrollW: box.scrollWidth, boxClientW: box.clientWidth,
      imgSrc: img && img.getAttribute('src'), imgRight: ir && Math.round(ir.right), imgW: ir && Math.round(ir.width), imgH: ir && Math.round(ir.height),
      imgNatural: img && (img.naturalWidth + 'x' + img.naturalHeight), imgComplete: img && img.complete,
      figRadius: img && getComputedStyle(img.parentElement).borderRadius,
      btns: [...box.querySelectorAll('[data-copy]')].map(b=>({copy: b.dataset.copy, label: b.textContent.trim(), right: Math.round(b.getBoundingClientRect().right)}))
    };
  }
  // taxi card in C
  const dc = document.getElementById('c').contentDocument;
  const li = [...dc.querySelectorAll('#cards .card, .card')].filter(e=>e.textContent.includes('临沂路359号，国大药房'));
  out.taxiCard = li.slice(0,1).map(e=>{const r=e.getBoundingClientRect(); return {right: Math.round(r.right), w: Math.round(r.width), txt: e.textContent.trim().slice(0,70)};});
  out.taxiLede = (dc.getElementById('ledeScene')||{}).textContent;
  return out;
};
window.__shots = (k) => { const d = document.getElementById(k).contentDocument;
  const h4 = [...d.querySelectorAll('h4')].find(h=>h.textContent.includes('Plan B'));
  if (h4) h4.scrollIntoView({block:'start'});
  return true; };
window.__open = () => {
  const db = prep('b'); db.getElementById('routeToggle').click();
  const dc = prep('c'); dc.querySelector('[data-place="taxi"]').click();
  const sc = dc.querySelectorAll('[data-scene]'); if (sc.length) sc[0].click();
  return true;
};
window.__fix = () => {
  const db = document.getElementById('b').contentDocument;
  const h4 = [...db.querySelectorAll('h4')].find(h=>h.textContent.includes('Plan B'));
  if (h4) h4.scrollIntoView({block:'start'});
  window.scrollTo(0,0);
  return true;
};
Promise.all([ready('a'),ready('b'),ready('c')]).then(()=>{
  window.__open();
  setTimeout(()=>{ window.__fix(); document.title = 'ready'; }, 700);
});
</script>
</body></html>
